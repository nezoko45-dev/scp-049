name: Build Grid Backend EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish grid-backend-dotnet/GridBackend.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SCP-049-GridBackend-Windows
          path: publish/GridBackend.exe
