name: Build SCP-049 Grid Backend EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "grid-backend-dotnet/**"
      - ".github/workflows/build-grid-backend-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows EXE
        run: dotnet publish grid-backend-dotnet/GridBackend.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Include navigation grid starter file
        shell: pwsh
        run: Copy-Item facility-navdata.json publish/facility-navdata.json -Force
      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: SCP-049-GridBackend-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
