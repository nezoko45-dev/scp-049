<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCP-049 Breach</title><style>html,body{margin:0;height:100%;background:#07090b;overflow:hidden;font-family:Arial;color:white}body{display:grid;place-items:center}canvas{max-width:100vw;max-height:100vh;background:#11161a}</style></head><body><canvas id="g" width="1100" height="700"></canvas><script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=1100,H=700,K={};onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.key==='e')openNear(p);if(e.key==='Enter'&&over)reset()};onkeyup=e=>K[e.key.toLowerCase()]=0;onmousedown=()=>K.mouse=1;onmouseup=()=>K.mouse=0;
const rooms=[{x:30,y:30,w:250,h:190},{x:310,y:30,w:280,h:190},{x:620,y:30,w:450,h:190},{x:30,y:250,w:300,h:200},{x:360,y:250,w:300,h:200},{x:690,y:250,w:380,h:200},{x:30,y:480,w:260,h:190},{x:320,y:480,w:290,h:190},{x:640,y:480,w:430,h:190}], halls=[{x:270,y:90,w:70,h:100},{x:580,y:90,w:70,h:100},{x:300,y:310,w:100,h:80},{x:630,y:310,w:100,h:80},{x:270,y:530,w:100,h:90},{x:600,y:530,w:100,h:90},{x:100,y:190,w:100,h:100},{x:420,y:190,w:100,h:100},{x:790,y:190,w:100,h:100},{x:100,y:430,w:100,h:100},{x:420,y:430,w:100,h:100},{x:790,y:430,w:100,h:100}],doorDefs=[{x:300,y:125,w:40,h:20},{x:610,y:125,w:40,h:20},{x:340,y:310,w:20,h:50},{x:670,y:310,w:20,h:50},{x:290,y:550,w:40,h:20},{x:610,y:550,w:40,h:20},{x:140,y:240,w:20,h:40},{x:460,y:240,w:20,h:40},{x:830,y:240,w:20,h:40},{x:140,y:440,w:20,h:40},{x:460,y:440,w:20,h:40},{x:830,y:440,w:20,h:40}];
let p,s,people,zeds,doors,over,clock,last,path=[];const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){p={x:80,y:350,r:11,hp:100,sp:210,ang:0,hit:-9,atk:0};s={x:900,y:120,r:17,hp:15000,sp:92,dead:0,target:p};people=[];zeds=[];doors=doorDefs.map(a=>({...a,open:false}));over=0;clock=0;last=performance.now();path=[];for(let i=0;i<8;i++){let r=rooms[i+1];people.push({x:rnd(r.x+30,r.x+r.w-30),y:rnd(r.y+30,r.y+r.h-30),r:9,dead:0})}}
function inside(a,b,r=0){return a.x+r>b.x&&a.x-r<b.x+b.w&&a.y+r>b.y&&a.y-r<b.y+b.h}
function floorOK(px,py,r=0){/* NO EDGE COLLISION: actor center may cross room/hall boundaries freely. Only the outer canvas limits movement. */if(px<0||px>W||py<0||py>H)return false;return rooms.some(a=>inside({x:px,y:py},a,-r))||halls.some(a=>inside({x:px,y:py},a,0))}
function blocked(px,py,r){return doors.some(a=>!a.open&&inside({x:px,y:py},a,r))}
function can(px,py,r){return floorOK(px,py,r)&&!blocked(px,py,r)}
function move(o,nx,ny){/* no edge/wall snagging; slide independently on each axis */if(can(nx,ny,o.r)){o.x=nx;o.y=ny;return 1}if(can(nx,o.y,o.r))o.x=nx;if(can(o.x,ny,o.r))o.y=ny;return 0}
function openDoor(a){if(!a||a.open)return;a.open=true;path=[]}
function openNear(o){for(const a of doors)if(!a.open&&d(o,{x:a.x+a.w/2,y:a.y+a.h/2})<125)openDoor(a)}
function autoDoor(o){for(const a of doors)if(!a.open&&d(o,{x:a.x+a.w/2,y:a.y+a.h/2})<130){openDoor(a);return 1}return 0}
function nearest(){let q=null,b=1e9;for(const z of people)if(!z.dead&&d(z,s)<b)b=d(z,s),q=z;return q}
function infect(a){if(!a||a.dead)return;a.dead=1;zeds.push({x:a.x,y:a.y,r:12,hp:100,sp:78,hit:-9});s.target=p;path=[]}
function hurt(t){if(t-p.hit<3)return;p.hit=t;p.hp=Math.max(0,p.hp-25);if(!p.hp)over=1}
function sword(){if(p.atk>0)return;p.atk=.25;let q={x:p.x+Math.cos(p.ang)*42,y:p.y+Math.sin(p.ang)*42};if(!s.dead&&d(q,s)<50){s.hp-=45;if(s.hp<=0){s.hp=0;s.dead=1;over=1}}for(const z of zeds)if(d(q,z)<45)z.hp-=45}
function grid(a){return [Math.floor(a.x/20),Math.floor(a.y/20)]}function pass(gx,gy){return floorOK(gx*20+10,gy*20+10,3)}
function astar(a,b){let[A,B]=grid(a),[G,J]=grid(b),O=[{x:A,y:B,g:0,p:null}],best=new Map([[A+','+B,0]]),closed=new Set;while(O.length){O.sort((u,v)=>(u.g+Math.abs(G-u.x)+Math.abs(J-u.y))-(v.g+Math.abs(G-v.x)+Math.abs(J-v.y)));let n=O.shift(),k=n.x+','+n.y;if(closed.has(k))continue;if(n.x===G&&n.y===J){let r=[];while(n){r.push({x:n.x*20+10,y:n.y*20+10});n=n.p}return r.reverse()}closed.add(k);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let X=n.x+dx,Y=n.y+dy;if(X<0||Y<0||X>=55||Y>=35||!pass(X,Y))continue;let kk=X+','+Y,gg=n.g+1;if(best.has(kk)&&best.get(kk)<=gg)continue;best.set(kk,gg);O.push({x:X,y:Y,g:gg,p:n})}}return[]}
function updateSCP(dt,t){if(s.dead)return;let q=nearest();if(q&&d(s,q)<48)infect(q);s.target=q&&!q.dead?q:p;if(!path.length||t-clock>.25){path=astar(s,s.target);clock=t}autoDoor(s);let w=path.find(a=>d(a,s)>8)||s.target,a=Math.atan2(w.y-s.y,w.x-s.x);if(!move(s,s.x+Math.cos(a)*s.sp*dt,s.y+Math.sin(a)*s.sp*dt))autoDoor(s);if(d(s,p)<38)hurt(t)}
function update(dt,t){if(over)return;clock=t;p.atk=Math.max(0,p.atk-dt);let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){let q=Math.hypot(dx,dy);dx/=q;dy/=q;p.ang=Math.atan2(dy,dx);if(!move(p,p.x+dx*p.sp*dt,p.y+dy*p.sp*dt))autoDoor(p)}if(K[' ']||K.mouse)sword();updateSCP(dt,t);for(const z of zeds){if(z.hp<=0)continue;let a=Math.atan2(p.y-z.y,p.x-z.x);if(!move(z,z.x+Math.cos(a)*z.sp*dt,z.y+Math.sin(a)*z.sp*dt))autoDoor(z);if(d(z,p)<34)hurt(t)}zeds=zeds.filter(a=>a.hp>0)}
function draw(){x.fillStyle='#090d10';x.fillRect(0,0,W,H);for(const a of rooms){x.fillStyle='#171d21';x.fillRect(a.x,a.y,a.w,a.h);x.strokeStyle='#3a4247';x.lineWidth=3;x.strokeRect(a.x,a.y,a.w,a.h)}for(const a of halls){x.fillStyle='#20282d';x.fillRect(a.x,a.y,a.w,a.h)}for(const a of doors)if(!a.open){x.fillStyle='#a22b2b';x.fillRect(a.x,a.y,a.w,a.h)}for(const a of people)if(!a.dead){x.fillStyle='#6ab9ed';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}for(const z of zeds){x.fillStyle='#5d914f';x.beginPath();x.arc(z.x,z.y,z.r,0,7);x.fill()}if(!s.dead){x.fillStyle='#ddd';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(s.x,s.y,12,0,7);x.fill()}x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='#eee';x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(7,0);x.lineTo(38,0);x.stroke();x.restore();x.fillStyle='rgba(0,0,0,.8)';x.fillRect(0,0,W,65);x.fillStyle='#fff';x.font='bold 19px Arial';x.fillText('SCP-049: CONTAINMENT BREACH',18,25);x.font='13px Arial';x.fillText('WASD / ARROWS MOVE • SPACE/CLICK SWORD • E OPEN DOORS',18,48);x.fillText('PLAYER '+p.hp+'/100',330,25);x.fillText('SCP-049 '+s.hp+'/15000',500,25);x.fillText('ZOMBIES '+zeds.length,700,25);if(over){x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,W,H);x.textAlign='center';x.font='bold 45px Arial';x.fillStyle=s.dead?'#9f9':'#f66';x.fillText(s.dead?'SCP-049 NEUTRALIZED':'YOU DIED',W/2,H/2);x.font='18px Arial';x.fillStyle='#fff';x.fillText('ENTER TO RESTART',W/2,H/2+40);x.textAlign='left'}}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt,t/1000);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
