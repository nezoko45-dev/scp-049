<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCP-049 Breach</title><style>html,body{margin:0;height:100%;background:#050708;overflow:hidden;font-family:Arial;color:white}body{display:grid;place-items:center}canvas{max-width:100vw;max-height:100vh;background:#0d1215}</style></head><body><canvas id="g" width="1100" height="700"></canvas><script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=1100,H=700,K={};onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')openNear(p);if(e.key==='Enter'&&over)reset()};onkeyup=e=>K[e.key.toLowerCase()]=0;onmousedown=()=>K.mouse=1;onmouseup=()=>K.mouse=0;
// NEW MAP: one huge connected facility with a central spine, two loops and wide room entrances.
const rooms=[
{x:35,y:35,w:235,h:170,n:'Security'},{x:300,y:35,w:230,h:170,n:'Medical'},{x:560,y:35,w:245,h:170,n:'Research'},{x:835,y:35,w:230,h:170,n:'Storage'},
{x:35,y:255,w:235,h:185,n:'Dorms'},{x:300,y:255,w:230,h:185,n:'Cafeteria'},{x:560,y:255,w:245,h:185,n:'Lab'},{x:835,y:255,w:230,h:185,n:'Armory'},
{x:35,y:490,w:235,h:175,n:'Archives'},{x:300,y:490,w:230,h:175,n:'Control'},{x:560,y:490,w:245,h:175,n:'Generator'},{x:835,y:490,w:230,h:175,n:'Containment'}],
halls=[
{x:270,y:95,w:60,h:80},{x:530,y:95,w:60,h:80},{x:805,y:95,w:60,h:80},
{x:270,y:315,w:60,h:75},{x:530,y:315,w:60,h:75},{x:805,y:315,w:60,h:75},
{x:270,y:545,w:60,h:65},{x:530,y:545,w:60,h:65},{x:805,y:545,w:60,h:65},
{x:115,y:205,w:80,h:70},{x:385,y:205,w:80,h:70},{x:660,y:205,w:80,h:70},{x:930,y:205,w:80,h:70},
{x:115,y:440,w:80,h:75},{x:385,y:440,w:80,h:75},{x:660,y:440,w:80,h:75},{x:930,y:440,w:80,h:75},
// central super-wide vertical and horizontal routes
{x:270,y:205,w:595,h:55},{x:270,y:440,w:595,h:50},{x:270,y:205,w:60,h:285},{x:805,y:205,w:60,h:285}],
doorDefs=[
{x:275,y:115,w:45,h:30},{x:535,y:115,w:45,h:30},{x:810,y:115,w:45,h:30},
{x:275,y:330,w:45,h:30},{x:535,y:330,w:45,h:30},{x:810,y:330,w:45,h:30},
{x:275,y:550,w:45,h:30},{x:535,y:550,w:45,h:30},{x:810,y:550,w:45,h:30},
{x:135,y:230,w:40,h:22},{x:405,y:230,w:40,h:22},{x:680,y:230,w:40,h:22},{x:950,y:230,w:40,h:22},
{x:135,y:455,w:40,h:22},{x:405,y:455,w:40,h:22},{x:680,y:455,w:40,h:22},{x:950,y:455,w:40,h:22}];
let p,s,people,zeds,doors,over,clock,last,path=[];const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){p={x:130,y:350,r:11,hp:100,sp:210,ang:0,hit:-9,atk:0};s={x:950,y:130,r:17,hp:15000,sp:92,dead:0,target:p};people=[];zeds=[];doors=doorDefs.map(a=>({...a,open:false}));over=0;clock=0;last=performance.now();path=[];
for(let i=0;i<12;i++){let r=rooms[i];people.push({x:rnd(r.x+35,r.x+r.w-35),y:rnd(r.y+35,r.y+r.h-35),r:9,dead:0})}}
function floorOK(px,py,r=0){/* Actors can NEVER get trapped by room edges: the entire facility floor is walkable. */return px>=r&&px<=W-r&&py>=r&&py<=H-r}
function blocked(px,py,r){return doors.some(a=>!a.open&&a.x<px+r&&a.x+a.w>px-r&&a.y<py+r&&a.y+a.h>py-r)}
function can(px,py,r){return floorOK(px,py,r)&&!blocked(px,py,r)}
function move(o,nx,ny){if(can(nx,ny,o.r)){o.x=nx;o.y=ny;return 1}if(can(nx,o.y,o.r))o.x=nx;if(can(o.x,ny,o.r))o.y=ny;return 0}
function openDoor(a){if(!a||a.open)return;a.open=true;path=[]}function openNear(o){for(const a of doors)if(!a.open&&d(o,{x:a.x+a.w/2,y:a.y+a.h/2})<125)openDoor(a)}
function autoDoor(o){for(const a of doors)if(!a.open&&d(o,{x:a.x+a.w/2,y:a.y+a.h/2})<145){openDoor(a);return 1}return 0}
function nearest(){let q=null,b=1e9;for(const z of people)if(!z.dead&&d(z,s)<b)b=d(z,s),q=z;return q}
function infect(a){if(!a||a.dead)return;a.dead=1;zeds.push({x:a.x,y:a.y,r:12,hp:100,sp:78,hit:-9});s.target=p;path=[]}
function hurt(t){if(t-p.hit<3)return;p.hit=t;p.hp=Math.max(0,p.hp-25);if(!p.hp)over=1}
function sword(){if(p.atk>0)return;p.atk=.25;let q={x:p.x+Math.cos(p.ang)*42,y:p.y+Math.sin(p.ang)*42};if(!s.dead&&d(q,s)<50){s.hp=Math.max(0,s.hp-45);if(!s.hp){s.dead=1;over=1}}for(const z of zeds)if(d(q,z)<45)z.hp-=45}
function grid(a){return [Math.max(0,Math.min(54,Math.floor(a.x/20))),Math.max(0,Math.min(34,Math.floor(a.y/20)))]}
function astar(a,b){let[A,B]=grid(a),[G,J]=grid(b),O=[{x:A,y:B,g:0,p:null}],best=new Map([[A+','+B,0]]),closed=new Set;while(O.length){O.sort((u,v)=>(u.g+Math.abs(G-u.x)+Math.abs(J-u.y))-(v.g+Math.abs(G-v.x)+Math.abs(J-v.y)));let n=O.shift(),k=n.x+','+n.y;if(closed.has(k))continue;if(n.x===G&&n.y===J){let r=[];while(n){r.push({x:n.x*20+10,y:n.y*20+10});n=n.p}return r.reverse()}closed.add(k);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let X=n.x+dx,Y=n.y+dy;if(X<0||Y<0||X>=55||Y>=35)continue;let kk=X+','+Y,gg=n.g+1;if(best.has(kk)&&best.get(kk)<=gg)continue;best.set(kk,gg);O.push({x:X,y:Y,g:gg,p:n})}}return[]}
function updateSCP(dt,t){if(s.dead)return;let q=nearest();if(q&&d(s,q)<48)infect(q);s.target=q&&!q.dead?q:p;if(!path.length||t-clock>.25){path=astar(s,s.target);clock=t}autoDoor(s);let w=path.find(a=>d(a,s)>10)||s.target,a=Math.atan2(w.y-s.y,w.x-s.x);move(s,s.x+Math.cos(a)*s.sp*dt,s.y+Math.sin(a)*s.sp*dt);if(d(s,p)<38)hurt(t)}
function update(dt,t){if(over)return;clock=t;p.atk=Math.max(0,p.atk-dt);let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){let q=Math.hypot(dx,dy);dx/=q;dy/=q;p.ang=Math.atan2(dy,dx);move(p,p.x+dx*p.sp*dt,p.y+dy*p.sp*dt);openNear(p)}if(K[' ']||K.mouse)sword();updateSCP(dt,t);for(const z of zeds){if(z.hp<=0)continue;let a=Math.atan2(p.y-z.y,p.x-z.x);move(z,z.x+Math.cos(a)*z.sp*dt,z.y+Math.sin(a)*z.sp*dt);autoDoor(z);if(d(z,p)<34)hurt(t)}zeds=zeds.filter(a=>a.hp>0)}
function draw(){x.fillStyle='#080c0f';x.fillRect(0,0,W,H);
// floor base: intentionally open so there are no invisible walls
x.fillStyle='#171d21';x.fillRect(18,18,W-36,H-36);
// rooms
for(const a of rooms){x.fillStyle='#11181c';x.fillRect(a.x,a.y,a.w,a.h);x.strokeStyle='#465057';x.lineWidth=3;x.strokeRect(a.x,a.y,a.w,a.h);x.fillStyle='#29343a';x.font='bold 12px Arial';x.fillText(a.n,a.x+12,a.y+20)}
// corridors
for(const a of halls){x.fillStyle='#252e33';x.fillRect(a.x,a.y,a.w,a.h)}
// decorative center routes
x.strokeStyle='#303b41';x.lineWidth=2;x.strokeRect(285,220,550,25);x.strokeRect(285,450,550,20);
for(const a of doors)if(!a.open){x.fillStyle='#a32c2c';x.fillRect(a.x,a.y,a.w,a.h)}
for(const a of people)if(!a.dead){x.fillStyle='#68b7e7';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}
for(const z of zeds){x.fillStyle='#65964f';x.beginPath();x.arc(z.x,z.y,z.r,0,7);x.fill()}
if(!s.dead){x.fillStyle='#ddd';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(s.x,s.y,12,0,7);x.fill()}
x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='#eee';x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(7,0);x.lineTo(38,0);x.stroke();x.restore();
x.fillStyle='rgba(0,0,0,.82)';x.fillRect(0,0,W,65);x.fillStyle='#fff';x.font='bold 19px Arial';x.fillText('SCP-049: CONTAINMENT BREACH',18,25);x.font='13px Arial';x.fillText('WASD / ARROWS MOVE • SPACE/CLICK SWORD • E OPEN BLAST DOORS',18,48);x.fillText('PLAYER '+p.hp+'/100',350,25);x.fillText('SCP-049 '+s.hp+'/15000',500,25);x.fillText('ZOMBIES '+zeds.length,700,25);
if(over){x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,W,H);x.textAlign='center';x.font='bold 45px Arial';x.fillStyle=s.dead?'#9f9':'#f66';x.fillText(s.dead?'SCP-049 NEUTRALIZED':'YOU DIED',W/2,H/2);x.font='18px Arial';x.fillStyle='#fff';x.fillText('ENTER TO RESTART',W/2,H/2+40);x.textAlign='left'}}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt,t/1000);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
