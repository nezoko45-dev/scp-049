   const moveSpeed=previous?Math.hypot(t.obj.position.x-previous.x,t.obj.position.z-previous.z)/elapsed:0;
   scpObservedMotion.set(t.obj,{x:t.obj.position.x,z:t.obj.position.z,at:now});
   return {...t,moveSpeed,distance:Math.hypot(t.obj.position.x-bad.position.x,t.obj.position.z-bad.position.z)};
  }).filter(t=>t.moveSpeed>.32);
  const currentObj=scpTarget?.obj||null;
  const currentInvalid=!!scpTarget&&(!currentObj||(scpTarget.kind==='survivor'&&(currentObj.userData.hp<=0||currentObj.userData.dead)));
  if(currentInvalid){scpTarget=null;scpTargetUntil=0}
  // Hold each selected target for exactly 11 seconds, then choose a different
  // moving target based on its measured position-change speed.
  if(!scpTarget||now>=scpTargetUntil){
   const choices=movingPool.filter(t=>t.obj!==scpTarget?.obj);
   const ranked=choices.sort((a,b)=>(b.moveSpeed*2-b.distance*.035)-(a.moveSpeed*2-a.distance*.035));
   let pick=ranked[0]||null;
   if(!pick&&scpTarget&&!currentInvalid)pick={kind:scpTarget.kind,obj:scpTarget.obj,index:scpTarget.index,moveSpeed:0,distance:Math.hypot(scpTarget.obj.position.x-bad.position.x,scpTarget.obj.position.z-bad.position.z)};
   // If nobody is currently moving, still pursue the nearest living target.
   if(!pick)pick=livingPool.map(t=>({...t,distance:Math.hypot(t.obj.position.x-bad.position.x,t.obj.position.z-bad.position.z),moveSpeed:0})).sort((a,b)=>a.distance-b.distance)[0]||null;
   if(pick){scpTarget={kind:pick.kind,obj:pick.obj,index:pick.index};scpTargetUntil=now+11000}
   else{scpTarget=null;scpTargetUntil=now+11000}
  }
  const targetObj=scpTarget?.obj||null;
  const targetValid=!!(targetObj&&(targetObj===playerObj||(targetObj.userData.hp>0&&!targetObj.userData.dead)));
  // Persistent steering replaces the breadcrumb generator and particle chain.
  bad.userData.particleRoute=null;bad.userData.particleRouteGoal=null;
  bad.userData.particleRouteTargetObj=targetObj;
  scpParticleTrail.visible=false;
  let scpMoved=false;
  if(targetValid)scpMoved=moveSCPPolygonAI(bad,targetObj,3.2,dt);
  if(scpRayGizmos){drawSCPRayGizmos(bad);drawZombieLocalGridGizmos()}
  if(mixer){mixer.update(dt);let action=scpMoved&&walk?walk:idle;if(action&&action!==bad.userData.a){action.reset().fadeIn(.2).play();bad.userData.a?.fadeOut(.2);bad.userData.a=action}}
  if(dist<1.8&&now-(window.playerLastSCPHit||0)>=3000){window.playerLastSCPHit=now;playerHP=Math.max(0,playerHP-25);if(playerHP<=0){playerHP=playerMaxHP;ctl.getObject().position.set(0,1.7,16);window.playerLastSCPHit=now;noise=0;document.querySelector('#msg').textContent='PLAYER RESPAWNED';}}allies.forEach(a=>{if(a.userData.hp>0&&Math.hypot(a.position.x-bad.position.x,a.position.z-bad.position.z)<1.8&&now-a.userData.lastSCPHit>=3000){a.userData.lastSCPHit=now;a.userData.hp=Math.max(0,a.userData.hp-25);if(a.userData.hp<=0){a.userData.dead=true;a.visible=false;a.userData.respawnAt=now+6000;if(scpTarget?.kind==='survivor'&&scpTarget.index===allies.indexOf(a)){scpTarget=null;scpTargetUntil=0;navPath=[]}}}});if(playerHP<=0)gameover('SCP-049 CAUGHT YOU');
  document.querySelector('#stats').innerHTML='PLAYER HP '+Math.ceil(playerHP)+'%<br>SURVIVORS '+allies.filter(a=>a.userData.hp>0).map(a=>Math.ceil(a.userData.hp)).join('/')+' HP<br>BOSS '+Math.ceil(bossHP)+' / '+bossMax+' HP ('+Math.ceil(bossHP/bossMax*100)+'%)<br>ALLIES '+allies.length+' · ZOMBIES '+zombies.length+'<br>STAMINA '+Math.floor(stam)+'%';
  document.querySelector('#msg').textContent=dist<12?'Footsteps nearby…':bossHP<=0?'BOSS DEFEATED':'';
 }
 renderer.render(scene,cam);
}
requestAnimationFrame(frame);onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script>
