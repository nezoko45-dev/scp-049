  });
  zombies=zombies.filter(z=>{if(z.userData.hp<=0){scene.remove(z);return false}return true});

  let f=+!!keys.KeyW-+!!keys.KeyS,side=+!!keys.KeyD-+!!keys.KeyA,sprint=(keys.ShiftLeft||keys.ShiftRight)&&stam>0&&f>0;

 }
 renderer.render(scene,cam)
