<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCP-049: Containment Breach</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07090b;color:#eee;font-family:Arial;overflow:hidden}#wrap{height:100%;display:flex;align-items:center;justify-content:center}canvas{width:min(1100px,100vw);height:auto;background:#101418;border:2px solid #333}#hint{position:fixed;bottom:8px;left:10px;color:#aaa;font-size:13px}</style></head><body><div id="wrap"><canvas id="game" width="1100" height="700"></canvas></div><div id="hint">WASD / Arrow Keys: move • Space / Left Click: sword • E: open blast doors</div><script>
'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=1100,H=700,CELL=25,COLS=44,ROWS=28,keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')openNearbyDoors();if(e.key==='Enter'&&gameOver)reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('mousedown',()=>keys.mouse=1);addEventListener('mouseup',()=>keys.mouse=0);const rnd=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let player,scp,survivors,zombies,particles,gameOver,breachTimer,flash,shake,last,scpPath,scpPathAt,doors;
const rooms=[{x:25,y:25,w:250,h:190},{x:300,y:25,w:275,h:190},{x:600,y:25,w:475,h:190},{x:25,y:255,w:310,h:190},{x:365,y:255,w:300,h:190},{x:695,y:255,w:380,h:190},{x:25,y:485,w:260,h:190},{x:315,y:485,w:300,h:190},{x:645,y:485,w:430,h:190}];
const corridors=[{x:275,y:95,w:25,h:50},{x:575,y:95,w:25,h:50},{x:335,y:320,w:30,h:50},{x:665,y:320,w:30,h:50},{x:285,y:545,w:30,h:50},{x:615,y:545,w:30,h:50},{x:125,y:215,w:50,h:40},{x:445,y:215,w:50,h:40},{x:825,y:215,w:50,h:40},{x:125,y:445,w:50,h:40},{x:445,y:445,w:50,h:40},{x:825,y:445,w:50,h:40}];
const doorDefs=[{x:275,y:112,w:25,h:16},{x:575,y:112,w:25,h:16},{x:337,y:320,w:26,h:16},{x:667,y:320,w:26,h:16},{x:287,y:545,w:26,h:16},{x:617,y:545,w:26,h:16},{x:142,y:215,w:16,h:25},{x:462,y:215,w:16,h:25},{x:842,y:215,w:16,h:25},{x:142,y:445,w:16,h:25},{x:462,y:445,w:16,h:25},{x:842,y:445,w:16,h:25}];
function reset(){player={x:75,y:350,r:12,hp:100,speed:190,lastHit:-99,attack:0,dir:0};scp={x:900,y:115,r:18,hp:15000,max:15000,speed:88,lastDamage:-99,target:null,dead:false};survivors=[];zombies=[];particles=[];gameOver=false;breachTimer=0;flash=0;shake=0;scpPath=[];scpPathAt=0;doors=doorDefs.map(d=>({...d,open:false}));last=performance.now();for(let i=0;i<8;i++){let r=rooms[(i+1)%rooms.length];survivors.push({x:r.x+rnd(35,r.w-35),y:r.y+rnd(35,r.h-35),r:10,dead:false})}}
function doorBlocks(x,y,r=0){for(const d of doors)if(!d.open&&x+r>d.x&&x-r<d.x+d.w&&y+r>d.y&&y-r<d.y+d.h)return true;return false}
// Hallways are only 25–30 px wide, so applying the actor radius to their bounds made the
// effective walkable width almost zero. Treat the hallway centerline as walkable and let
// doors provide the actual barrier. Room edges still use actor radius for wall collision.
function walkable(x,y,r=0){if(x<r||x>W-r||y<r||y>H-r)return false;for(const a of rooms)if(x>=a.x+r&&x<=a.x+a.w-r&&y>=a.y+r&&y<=a.y+a.h-r)return !doorBlocks(x,y,r);for(const a of corridors)if(x>=a.x&&x<=a.x+a.w&&y>=a.y&&y<=a.y+a.h)return !doorBlocks(x,y,0);return false}
function move(o,nx,ny){if(walkable(nx,ny,o.r)){o.x=nx;o.y=ny;return true}if(walkable(nx,o.y,o.r))o.x=nx;if(walkable(o.x,ny,o.r))o.y=ny;return false}
function openDoor(d){if(d.open)return;d.open=true;let cx=d.x+d.w/2,cy=d.y+d.h/2;for(let i=0;i<10;i++)particles.push({x:cx+rnd(-8,8),y:cy+rnd(-8,8),vx:rnd(-25,25),vy:rnd(-25,25),life:.5});scpPath=[];scpPathAt=0;flash=.12}
function openNearbyDoors(){if(gameOver)return;for(const d of doors)if(!d.open&&Math.hypot(player.x-(d.x+d.w/2),player.y-(d.y+d.h/2))<100)openDoor(d)}
function autoOpenDoor(o,range=48){for(const d of doors)if(!d.open&&Math.hypot(o.x-(d.x+d.w/2),o.y-(d.y+d.h/2))<range){openDoor(d);return true}return false}
function nearestSurvivor(){let b=null,bd=Infinity;for(const s of survivors)if(!s.dead){let d=D(s,scp);if(d<bd){bd=d;b=s}}return b}
function spawnZombie(s){zombies.push({x:s.x,y:s.y,r:13,hp:100,speed:rnd(62,78),lastHit:-99});for(let i=0;i<15;i++)particles.push({x:s.x,y:s.y,vx:rnd(-50,50),vy:rnd(-50,50),life:.7})}
function infectSurvivor(s){if(!s||s.dead)return false;s.dead=true;spawnZombie(s);scp.target=player;scpPath=[];scpPathAt=0;return true}
function hurt(now){if(now-player.lastHit<3)return;player.lastHit=now;player.hp=Math.max(0,player.hp-25);shake=7;if(player.hp===0)gameOver=true}
function attack(){if(player.attack>0)return;player.attack=.27;flash=.27;let hx=player.x+Math.cos(player.dir)*42,hy=player.y+Math.sin(player.dir)*42;if(!scp.dead&&Math.hypot(hx-scp.x,hy-scp.y)<50){scp.hp=Math.max(0,scp.hp-45);if(scp.hp===0){scp.dead=true;gameOver=true}}for(const z of zombies)if(Math.hypot(hx-z.x,hy-z.y)<45)z.hp-=45}
function cell(p){return [clamp(Math.floor(p.x/CELL),0,COLS-1),clamp(Math.floor(p.y/CELL),0,ROWS-1)]}function key(x,y){return x+','+y}function pass(x,y){return walkable(x*CELL+CELL/2,y*CELL+CELL/2,5)}
function astar(start,end){let [sx,sy]=cell(start),[gx,gy]=cell(end),open=[{x:sx,y:sy,g:0,f:Math.hypot(gx-sx,gy-sy),p:null}],best=new Map([[key(sx,sy),0]]),closed=new Set();while(open.length){open.sort((a,b)=>a.f-b.f);let n=open.shift(),k=key(n.x,n.y);if(closed.has(k))continue;if(n.x===gx&&n.y===gy){let out=[];while(n){out.push({x:n.x*CELL+CELL/2,y:n.y*CELL+CELL/2});n=n.p}return out.reverse()}closed.add(k);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=n.x+dx,y=n.y+dy;if(x<0||x>=COLS||y<0||y>=ROWS||!pass(x,y))continue;let nk=key(x,y),g=n.g+1;if(closed.has(nk)||(best.has(nk)&&best.get(nk)<=g))continue;best.set(nk,g);let f=g+Math.abs(gx-x)+Math.abs(gy-y);open.push({x,y,g,f,p:n})}}return[]}
function updateSCP(dt,now){if(scp.dead)return;let surv=nearestSurvivor();scp.target=surv||player;if(surv&&D(scp,surv)<45){infectSurvivor(surv);surv=null}let target=scp.target||player;autoOpenDoor(scp,58);if(now-scpPathAt>.25||!scpPath.length){scpPath=astar(scp,target);scpPathAt=now}let wp=scpPath[1]||scpPath[0]||target;if(wp){let a=Math.atan2(wp.y-scp.y,wp.x-scp.x),ok=move(scp,scp.x+Math.cos(a)*scp.speed*dt,scp.y+Math.sin(a)*scp.speed*dt);if(!ok)autoOpenDoor(scp,75)}if(D(scp,player)<38)hurt(now)}
function update(dt,now){if(gameOver)return;breachTimer+=dt;player.attack=Math.max(0,player.attack-dt);flash=Math.max(0,flash-dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;player.dir=Math.atan2(dy,dx);let ok=move(player,player.x+dx*player.speed*dt,player.y+dy*player.speed*dt);if(!ok)autoOpenDoor(player,78)}if(keys[' ']||keys.mouse)attack();updateSCP(dt,now);for(const z of zombies){if(z.hp<=0)continue;let a=Math.atan2(player.y-z.y,player.x-z.x);let ok=move(z,z.x+Math.cos(a)*z.speed*dt,z.y+Math.sin(a)*z.speed*dt);if(!ok)autoOpenDoor(z,60);if(D(z,player)<34)hurt(now)}zombies=zombies.filter(z=>z.hp>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt*18)}
function bar(x,y,w,h,p){ctx.fillStyle='#333';ctx.fillRect(x,y,w,h);ctx.fillStyle='#c84d4d';ctx.fillRect(x,y,w*clamp(p,0,1),h);ctx.strokeStyle='#888';ctx.strokeRect(x,y,w,h)}
function draw(){ctx.save();ctx.translate(rnd(-shake,shake),rnd(-shake,shake));ctx.fillStyle='#090c0f';ctx.fillRect(0,0,W,H);for(const r of rooms){ctx.fillStyle='#171c20';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#30383d';ctx.lineWidth=3;ctx.strokeRect(r.x,r.y,r.w,r.h)}for(const a of corridors){ctx.fillStyle='#171c20';ctx.fillRect(a.x,a.y,a.w,a.h)}for(const d of doors)if(!d.open){ctx.fillStyle='#8d2525';ctx.fillRect(d.x,d.y,d.w,d.h);ctx.strokeStyle='#ff6666';ctx.strokeRect(d.x,d.y,d.w,d.h)}for(const s of survivors)if(!s.dead){ctx.fillStyle='#69b9ee';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(const z of zombies){ctx.fillStyle='#5b8c4f';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.fillStyle='#172016';ctx.fillRect(z.x-6,z.y-3,3,3);ctx.fillRect(z.x+3,z.y-3,3,3)}if(!scp.dead){ctx.fillStyle='#0b0d0f';ctx.beginPath();ctx.arc(scp.x,scp.y,scp.r+5,0,7);ctx.fill();ctx.fillStyle='#d9d4c9';ctx.beginPath();ctx.arc(scp.x,scp.y,scp.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(scp.x,scp.y-2,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText('049',scp.x-8,scp.y+3)}ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(38,0);ctx.stroke();if(flash){ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,43,-.8,.8);ctx.stroke()}ctx.restore();for(const p of particles){ctx.globalAlpha=p.life*1.5;ctx.fillStyle='#ccc';ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1}ctx.restore();ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,70);ctx.fillStyle='#eee';ctx.font='bold 19px Arial';ctx.fillText('SCP-049: CONTAINMENT BREACH',18,27);ctx.font='13px Arial';ctx.fillStyle='#aaa';ctx.fillText(breachTimer<4?'CONTAINMENT BREACH — EVACUATE':scp.dead?'SCP-049 NEUTRALIZED':'SCP-049 — A* HUNTING',18,49);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('PLAYER '+player.hp+'/100',300,30);bar(390,18,170,16,player.hp/100);ctx.fillText('SCP-049 '+scp.hp+'/15000',585,30);bar(690,18,260,16,scp.hp/scp.max);ctx.fillStyle='#aaa';ctx.fillText('ZOMBIES '+zombies.length,970,30);let near=doors.some(d=>!d.open&&Math.hypot(player.x-(d.x+d.w/2),player.y-(d.y+d.h/2))<100);if(near&&!gameOver){ctx.fillStyle='#ffdf7a';ctx.font='bold 15px Arial';ctx.fillText('E — OPEN BLAST DOOR',W/2-95,95)}if(gameOver){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=scp.dead?'#9cff9c':'#ff7777';ctx.font='bold 44px Arial';ctx.fillText(scp.dead?'SCP-049 NEUTRALIZED':'YOU DIED',W/2,H/2);ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.fillText('Press ENTER to restart',W/2,H/2+40);ctx.textAlign='left'}}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt,t/1000);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
