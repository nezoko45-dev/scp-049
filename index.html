<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCP-049: Containment Breach</title><style>html,body{margin:0;height:100%;background:#07090b;color:#eee;font-family:Arial;overflow:hidden}#wrap{height:100%;display:flex;align-items:center;justify-content:center}canvas{width:min(1100px,100vw);height:auto;background:#101418;border:2px solid #333}#hint{position:fixed;bottom:8px;left:10px;color:#aaa;font-size:13px}</style></head><body><div id="wrap"><canvas id="game" width="1100" height="700"></canvas></div><div id="hint">WASD / Arrow Keys: move • Space / Left Click: sword • E: open blast doors</div><script>
'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=1100,H=700,keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')openNearby();if(e.key==='Enter'&&gameOver)reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('mousedown',()=>keys.mouse=1);addEventListener('mouseup',()=>keys.mouse=0);const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let player,scp,survivors,zombies,doors,particles,gameOver,last,breach,path,pathClock,flash,shake;
/* Entire floor plan rebuilt around a single connected set of wide floor rectangles. */
const floor=[
{x:30,y:30,w:250,h:190,n:'SECURITY'},{x:300,y:30,w:280,h:190,n:'MEDICAL'},{x:600,y:30,w:470,h:190,n:'RESEARCH'},
{x:30,y:250,w:300,h:200,n:'STORAGE'},{x:350,y:250,w:300,h:200,n:'CONTROL'},{x:670,y:250,w:400,h:200,n:'CELLS'},
{x:30,y:480,w:250,h:190,n:'ARMORY'},{x:300,y:480,w:300,h:190,n:'ARCHIVES'},{x:620,y:480,w:450,h:190,n:'GENERATOR'},
/* wide connectors intentionally overlap room edges */
{x:265,y:95,w:70,h:100,n:'C1'},{x:565,y:95,w:70,h:100,n:'C2'},{x:315,y:315,w:80,h:70,n:'C3'},{x:625,y:315,w:80,h:70,n:'C4'},{x:265,y:540,w:80,h:70,n:'C5'},{x:590,y:540,w:80,h:70,n:'C6'},
{x:105,y:195,w:100,h:70,n:'C7'},{x:425,y:195,w:100,h:70,n:'C8'},{x:795,y:195,w:100,h:70,n:'C9'},{x:105,y:435,w:100,h:70,n:'C10'},{x:425,y:435,w:100,h:70,n:'C11'},{x:795,y:435,w:100,h:70,n:'C12'}];
/* Doors are thin barriers across the wide connector openings. */
const defs=[{x:265,y:135,w:70,h:16},{x:565,y:135,w:70,h:16},{x:347,y:315,w:16,h:70},{x:655,y:315,w:16,h:70},{x:285,y:540,w:60,h:16},{x:590,y:540,w:80,h:16},{x:147,y:195,w:16,h:70},{x:467,y:195,w:16,h:70},{x:837,y:195,w:16,h:70},{x:147,y:435,w:16,h:70},{x:467,y:435,w:16,h:70},{x:837,y:435,w:16,h:70}];
function reset(){player={x:75,y:350,r:10,hp:100,speed:200,dir:0,lastHit:-99,attack:0};scp={x:910,y:120,r:17,hp:15000,max:15000,speed:90,target:null,dead:false};survivors=[];zombies=[];doors=defs.map(d=>({...d,open:false}));particles=[];gameOver=false;last=performance.now();breach=0;path=[];pathClock=0;flash=0;shake=0;for(let i=0;i<8;i++){let f=floor[i+1];survivors.push({x:rnd(f.x+35,f.x+f.w-35),y:rnd(f.y+35,f.y+f.h-35),r:9,dead:false})}}
function inside(x,y,r,a){return x+r>a.x&&x-r<a.x+a.w&&y+r>a.y&&y-r<a.y+a.h}
function onFloor(x,y,r=0){if(x<r||x>W-r||y<r||y>H-r)return false;return floor.some(f=>x>=f.x+r&&x<=f.x+f.w-r&&y>=f.y+r&&y<=f.y+f.h-r)}
function blocked(x,y,r=0){return doors.some(d=>!d.open&&inside(x,y,r,d))}
function walkable(x,y,r=0){return onFloor(x,y,r)&&!blocked(x,y,r)}
/* Small-step collision means nobody can tunnel through a wall or get wedged at an edge. */
function move(o,nx,ny){let dx=nx-o.x,dy=ny-o.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4)),px=o.x,py=o.y;for(let i=1;i<=n;i++){let x=o.x+dx*i/n,y=o.y+dy*i/n;if(!walkable(x,y,o.r)){if(walkable(x,py,o.r))px=x;if(walkable(px,y,o.r))py=y;o.x=px;o.y=py;return false}px=x;py=y}o.x=px;o.y=py;return true}
function openDoor(d){if(d.open)return;d.open=true;path=[];pathClock=0;flash=.12;for(let i=0;i<14;i++)particles.push({x:d.x+d.w/2+rnd(-8,8),y:d.y+d.h/2+rnd(-8,8),vx:rnd(-35,35),vy:rnd(-35,35),life:.55})}
function openNearby(){if(gameOver)return;for(const d of doors)if(!d.open&&Math.hypot(player.x-(d.x+d.w/2),player.y-(d.y+d.h/2))<120)openDoor(d)}
function autoDoor(o,range=85){let b=null,bd=range;for(const d of doors)if(!d.open){let q=Math.hypot(o.x-(d.x+d.w/2),o.y-(d.y+d.h/2));if(q<bd){bd=q;b=d}}if(b){openDoor(b);return true}return false}
function nearestSurvivor(){let b=null,q=Infinity;for(const s of survivors)if(!s.dead){let d=dist(s,scp);if(d<q){q=d;b=s}}return b}
function infect(s){if(!s||s.dead)return;s.dead=true;zombies.push({x:s.x,y:s.y,r:12,hp:100,speed:76,lastHit:-99});scp.target=player;path=[];pathClock=0}
function hurt(now){if(now-player.lastHit<3)return;player.lastHit=now;player.hp=Math.max(0,player.hp-25);shake=8;if(player.hp===0)gameOver=true}
function attack(){if(player.attack>0)return;player.attack=.25;flash=.2;let x=player.x+Math.cos(player.dir)*40,y=player.y+Math.sin(player.dir)*40;if(!scp.dead&&Math.hypot(x-scp.x,y-scp.y)<48){scp.hp=Math.max(0,scp.hp-45);if(!scp.hp){scp.dead=true;gameOver=true}}for(const z of zombies)if(Math.hypot(x-z.x,y-z.y)<45)z.hp-=45}
/* A* uses FLOOR only. Closed doors never erase the route; AI opens them when reached. */
const CELL=20,COLS=Math.ceil(W/CELL),ROWS=Math.ceil(H/CELL);function pass(gx,gy){return onFloor(gx*CELL+CELL/2,gy*CELL+CELL/2,4)}
function astar(a,b){let sx=clamp(Math.floor(a.x/CELL),0,COLS-1),sy=clamp(Math.floor(a.y/CELL),0,ROWS-1),gx=clamp(Math.floor(b.x/CELL),0,COLS-1),gy=clamp(Math.floor(b.y/CELL),0,ROWS-1),open=[{x:sx,y:sy,g:0,f:0,p:null}],best=new Map([[sx+','+sy,0]]),closed=new Set();while(open.length){open.sort((u,v)=>u.f-v.f);let n=open.shift(),k=n.x+','+n.y;if(closed.has(k))continue;if(n.x===gx&&n.y===gy){let out=[];while(n){out.push({x:n.x*CELL+10,y:n.y*CELL+10});n=n.p}return out.reverse()}closed.add(k);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=n.x+dx,y=n.y+dy;if(x<0||y<0||x>=COLS||y>=ROWS||!pass(x,y))continue;let nk=x+','+y,g=n.g+1;if(closed.has(nk)||(best.has(nk)&&best.get(nk)<=g))continue;best.set(nk,g);open.push({x,y,g,f:g+Math.abs(gx-x)+Math.abs(gy-y),p:n})}}return[]}
function updateSCP(dt,now){if(scp.dead)return;let s=nearestSurvivor();if(s&&dist(s,scp)<48){infect(s);s=null}scp.target=s||player;autoDoor(scp,80);if(now-pathClock>.25||!path.length){path=astar(scp,scp.target);pathClock=now}let wp=null;for(const p of path){if(Math.hypot(p.x-scp.x,p.y-scp.y)>7){wp=p;break}}wp=wp||scp.target;let a=Math.atan2(wp.y-scp.y,wp.x-scp.x),ok=move(scp,scp.x+Math.cos(a)*scp.speed*dt,scp.y+Math.sin(a)*scp.speed*dt);if(!ok)autoDoor(scp,120);if(dist(scp,player)<38)hurt(now)}
function update(dt,now){if(gameOver)return;breach+=dt;player.attack=Math.max(0,player.attack-dt);flash=Math.max(0,flash-dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;player.dir=Math.atan2(dy,dx);let ok=move(player,player.x+dx*player.speed*dt,player.y+dy*player.speed*dt);if(!ok)autoDoor(player,110)}if(keys[' ']||keys.mouse)attack();updateSCP(dt,now);for(const z of zombies){if(z.hp<=0)continue;let a=Math.atan2(player.y-z.y,player.x-z.x),ok=move(z,z.x+Math.cos(a)*z.speed*dt,z.y+Math.sin(a)*z.speed*dt);if(!ok)autoDoor(z,105);if(dist(z,player)<34)hurt(now)}zombies=zombies.filter(z=>z.hp>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt*20)}
function bar(x,y,w,h,p){ctx.fillStyle='#333';ctx.fillRect(x,y,w,h);ctx.fillStyle='#c84d4d';ctx.fillRect(x,y,w*clamp(p,0,1),h);ctx.strokeStyle='#888';ctx.strokeRect(x,y,w,h)}
function draw(){ctx.save();ctx.translate(rnd(-shake,shake),rnd(-shake,shake));ctx.fillStyle='#080b0e';ctx.fillRect(0,0,W,H);for(const f of floor){ctx.fillStyle=f.n[0]==='C'?'#20272b':'#171c20';ctx.fillRect(f.x,f.y,f.w,f.h);if(f.n[0]!=='C'){ctx.strokeStyle='#30383d';ctx.lineWidth=3;ctx.strokeRect(f.x,f.y,f.w,f.h)}}for(const d of doors)if(!d.open){ctx.fillStyle='#a52b2b';ctx.fillRect(d.x,d.y,d.w,d.h);ctx.strokeStyle='#ff7777';ctx.strokeRect(d.x,d.y,d.w,d.h)}for(const s of survivors)if(!s.dead){ctx.fillStyle='#69b9ee';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(const z of zombies){ctx.fillStyle='#5b8c4f';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.fillStyle='#172016';ctx.fillRect(z.x-6,z.y-3,3,3);ctx.fillRect(z.x+3,z.y-3,3,3)}if(!scp.dead){ctx.fillStyle='#0b0d0f';ctx.beginPath();ctx.arc(scp.x,scp.y,23,0,7);ctx.fill();ctx.fillStyle='#d9d4c9';ctx.beginPath();ctx.arc(scp.x,scp.y,scp.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(scp.x,scp.y-2,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText('049',scp.x-8,scp.y+3)}ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(38,0);ctx.stroke();ctx.restore();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ddd';ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1}ctx.restore();ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,70);ctx.fillStyle='#eee';ctx.font='bold 19px Arial';ctx.fillText('SCP-049: CONTAINMENT BREACH',18,27);ctx.font='13px Arial';ctx.fillStyle='#aaa';ctx.fillText(breach<4?'CONTAINMENT BREACH — EVACUATE':scp.dead?'SCP-049 NEUTRALIZED':'SCP-049 — A* HUNTING',18,49);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('PLAYER '+player.hp+'/100',300,30);bar(390,18,170,16,player.hp/100);ctx.fillText('SCP-049 '+scp.hp+'/15000',585,30);bar(690,18,260,16,scp.hp/scp.max);ctx.fillStyle='#aaa';ctx.fillText('ZOMBIES '+zombies.length,970,30);if(doors.some(d=>!d.open&&Math.hypot(player.x-(d.x+d.w/2),player.y-(d.y+d.h/2))<120)&&!gameOver){ctx.fillStyle='#ffdf7a';ctx.font='bold 15px Arial';ctx.fillText('E — OPEN BLAST DOOR',W/2-95,95)}if(gameOver){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=scp.dead?'#9cff9c':'#ff7777';ctx.font='bold 44px Arial';ctx.fillText(scp.dead?'SCP-049 NEUTRALIZED':'YOU DIED',W/2,H/2);ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.fillText('Press ENTER to restart',W/2,H/2+40);ctx.textAlign='left'}}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt,t/1000);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
