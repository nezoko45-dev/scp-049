function liveGridAvoidStep(obj,tx,tz,speed){

   }

function liveGridCellOpen(x,z){if(!backendGridOnline||!navData?.grid)return false;const c=cellOf(x,z);return c.x>=0&&c.z>=0&&c.x<navData.width&&c.z<navData.height&&!!navData.grid[c.z]?.[c.x]}
function nearestLiveOpen(x,z,around=7){if(!backendGridOnline||!navData?.grid)return null;const c=cellOf(x,z);let best=null,score=Infinity;for(let dz=-around;dz<=around;dz++)for(let dx=-around;dx<=around;dx++){const ix=c.x+dx,iz=c.z+dz;if(ix<0||iz<0||ix>=navData.width||iz>=navData.height||!navData.grid[iz]?.[ix])continue;const d=dx*dx+dz*dz;if(d<score){score=d;best={x:navData.origin.x+(ix+.5)*navData.cellSize,z:navData.origin.z+(iz+.5)*navData.cellSize}}}return best}
function moveByLiveGrid(obj,dx,dz,r=.35){const x=obj.position.x,z=obj.position.z,len=Math.hypot(dx,dz);if(len<1e-5)return false;if(!backendGridOnline||!navData?.grid)return false;const cs=navData.cellSize||1,n=Math.max(1,Math.ceil(len/(cs*.2)));let clear=true;for(let i=1;i<=n;i++){let t=i/n;if(!liveGridCellOpen(x+dx*t,z+dz*t)){clear=false;break}}if(clear&&!hit(x+dx,z+dz,r)){obj.position.x=x+dx;obj.position.z=z+dz;return true}const target=nearestLiveOpen(x+dx,z+dz,9);if(!target)return false;const vx=target.x-x,vz=target.z-z,d=Math.hypot(vx,vz),step=Math.min(len,d);if(d>1e-4&&!hit(x+vx/d*step,z+vz/d*step,r)){obj.position.x=x+vx/d*step;obj.position.z=z+vz/d*step;return true}return false}

function jsonRayClear(x,z,dx,dz,r=.4){if(!navReady||!navData?.grid)return false;const cs=navData.cellSize||1,steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/(cs*.2)));for(let i=0;i<=steps;i++){const t=i/steps,px=x+dx*t,pz=z+dz*t;if(hit(px,pz,r*.7))return false;for(const [ox,oz] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,0]]){const q=cellOf(px+ox,pz+oz);if(q.x<0||q.z<0||q.x>=navData.width||q.z>=navData.height||!navData.grid[q.z]?.[q.x])return false}}return true}

function jsonSteerMove(obj,dx,dz,r=.32){
 if(!navReady||!navData?.grid)return false;
 const x=obj.position.x,z=obj.position.z,cs=navData.cellSize||1,len=Math.hypot(dx,dz);
 if(len<1e-5)return false;
